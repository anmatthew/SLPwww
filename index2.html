<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenText Public Sector / Government industry solutions</title>
  <meta name="description" content="Continue to the OpenText guide: Smarter Guide to Information Management in the Public Sector.">
  <meta http-equiv="refresh" content="url=https://www.opentext.com/solutions/industry/government">
  <link rel="canonical" href="https://www.opentext.com/solutions/industry/government">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;1,14..32,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121212;
      --text: #ffffff;
      --link: #8ec8ff;
      --link-hover: #c6e3ff;
      --focus: #ffe566;
      --font: "Inter", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-optical-sizing: auto;
      font-weight: 400;
      line-height: 1.5;
      font-feature-settings: "liga" 1, "calt" 1;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .skip-link {
      position: absolute;
      left: 12px;
      top: -48px;
      z-index: 3;
      padding: 8px 12px;
      background: var(--focus);
      color: #111;
      font-family: var(--font);
      font-weight: 700;
      text-decoration: none;
    }
    .skip-link:focus { top: 12px; }
    header, footer {
      padding: 12px 16px;
      background: #111;
      border-color: #333;
      font-family: var(--font);
    }
    header { border-bottom: 1px solid #333; }
    footer { border-top: 1px solid #333; }
    h1 {
      margin: 0;
      font-family: var(--font);
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    main {
      max-width: 48rem;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    /* Full-width image in the page body */
    .top-image {
      display: block;
      width: 100vw;
      max-width: 100vw;
      height: auto;
      margin: 0 calc(50% - 50vw) 12px;
    }
    p, a, strong {
      font-family: var(--font);
    }
    strong { font-weight: 600; }
    a {
      color: var(--link);
      text-decoration: underline;
    }
    a:hover { color: var(--link-hover); }
    a:focus-visible, .skip-link:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    .action {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 8px 4px;
      font-weight: 500;
    }
    footer p {
      margin: 0;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <header role="banner">
    <a class="skip-link" href="#main-content">Skip tOpenText Public Sector / Government industry solutions</a>
    <h1>OpenText Public Sector / Government industry solutions</h1>
  </header>
  <main id="main-content" role="main" aria-label="Redirect to OpenText public sector">
    <img class="top-image" src="otgov.png" alt="OpenText">
    <p id="redirect-status" role="status">
      You will be redirected in one second...
      <a class="action" href="https://www.opentext.com/solutions/industry/government">
        Continue to the Opentext Public Sector now
      </a>
    </p>
  </main>

  <footer role="contentinfo">
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axe-core/4.10.3/axe.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script type="text/javascript">
    var dest = "https://www.opentext.com/solutions/industry/government";
    window.setTimeout(function () {
      window.location.replace(dest);
    }, 5000);
  </script>
  <script>
    (function (d, s, t) {
      var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s);
      j.async = true;
      j.src = "//dockaccess.org/accessibility/" + t + "/start.js";
      f.parentNode.insertBefore(j, f);
    })(document, "script", "gxLLDrBNatcrNSkt0pl2");
  </script>
</body>
</html>
